name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter.yml'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        shell: bash
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test; then
            echo "::warning::Dart formatting differs from dart format output. Formatting is currently non-blocking; analyzer and tests remain required."
          fi
      - run: flutter analyze
      - run: flutter test
